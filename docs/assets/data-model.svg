<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">PathLift PostgreSQL entity relationships</title>
  <desc id="desc">Users own learning goals, goals contain ordered topics, topics have user progress records, and goals have recommendation snapshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f1e4"/><stop offset="1" stop-color="#e8f1e8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718179"/></marker>
  </defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/>
  <text x="48" y="50" fill="#173b33" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">POSTGRESQL · CORE DATA MODEL</text>
  <g stroke="#718179" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M295 155H390"/><path d="M605 155H700"/><path d="M815 220V300"/><path d="M500 220V300"/><path d="M605 365H700"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g><rect x="70" y="90" width="225" height="130" rx="18" fill="#fffdf8" stroke="#d7ded4"/><path d="M70 108a18 18 0 0 1 18-18h189a18 18 0 0 1 18 18v28H70z" fill="#18483f"/><text x="92" y="121" fill="#fff" font-size="17" font-weight="700">users</text><text x="92" y="162" fill="#52665d" font-size="13">PK id · email · role</text><text x="92" y="187" fill="#52665d" font-size="13">interests · level · streak</text></g>
    <g><rect x="390" y="90" width="215" height="130" rx="18" fill="#fffdf8" stroke="#d7ded4"/><path d="M390 108a18 18 0 0 1 18-18h179a18 18 0 0 1 18 18v28H390z" fill="#287868"/><text x="412" y="121" fill="#fff" font-size="17" font-weight="700">learning_goals</text><text x="412" y="162" fill="#52665d" font-size="13">PK id · FK user_id</text><text x="412" y="187" fill="#52665d" font-size="13">title · target · status</text></g>
    <g><rect x="700" y="90" width="230" height="130" rx="18" fill="#fffdf8" stroke="#d7ded4"/><path d="M700 108a18 18 0 0 1 18-18h194a18 18 0 0 1 18 18v28H700z" fill="#287868"/><text x="722" y="121" fill="#fff" font-size="17" font-weight="700">topics</text><text x="722" y="162" fill="#52665d" font-size="13">PK id · FK goal_id</text><text x="722" y="187" fill="#52665d" font-size="13">sequence · phase · resources</text></g>
    <g><rect x="390" y="300" width="215" height="130" rx="18" fill="#fffdf8" stroke="#d7ded4"/><path d="M390 318a18 18 0 0 1 18-18h179a18 18 0 0 1 18 18v28H390z" fill="#d78c2e"/><text x="412" y="331" fill="#fff" font-size="17" font-weight="700">recommendations</text><text x="412" y="372" fill="#52665d" font-size="13">PK id · FK user_id</text><text x="412" y="397" fill="#52665d" font-size="13">FK goal_id · JSONB payload</text></g>
    <g><rect x="700" y="300" width="230" height="130" rx="18" fill="#fffdf8" stroke="#d7ded4"/><path d="M700 318a18 18 0 0 1 18-18h194a18 18 0 0 1 18 18v28H700z" fill="#d78c2e"/><text x="722" y="331" fill="#fff" font-size="17" font-weight="700">user_progress</text><text x="722" y="372" fill="#52665d" font-size="13">FK user_id · FK topic_id</text><text x="722" y="397" fill="#52665d" font-size="13">status · confidence · notes</text></g>
    <text x="319" y="142" fill="#63766d" font-size="12">1 : many</text>
    <text x="628" y="142" fill="#63766d" font-size="12">1 : many</text>
    <text x="830" y="267" fill="#63766d" font-size="12">1 : many</text>
    <text x="515" y="267" fill="#63766d" font-size="12">1 : many</text>
    <text x="626" y="352" fill="#63766d" font-size="12">goal context</text>
  </g>
