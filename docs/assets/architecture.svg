<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">PathLift system architecture</title>
  <desc id="desc">React client communicates with an Express API, which reads and writes PostgreSQL and requests optional OpenAI recommendations. A deterministic learning template is available as fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f1e4"/><stop offset="1" stop-color="#e8f1e8"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18483f"/><stop offset="1" stop-color="#287868"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63766d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#345147" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="54" y="57" fill="#173b33" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PATHLIFT · SYSTEM ARCHITECTURE</text>
  <text x="54" y="91" fill="#52665d" font-family="Arial,sans-serif" font-size="15">A personalized learning loop, from learner input to the next useful step.</text>
  <g stroke="#63766d" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 215H390"/><path d="M700 215H790"/><path d="M550 300V365H835V305"/><path d="M940 305V365H1050V305"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="245" height="160" rx="22" fill="#fffdf8" stroke="#d7ded4"/>
    <rect x="390" y="130" width="310" height="190" rx="24" fill="url(#api)"/>
    <rect x="790" y="145" width="310" height="160" rx="22" fill="#fffdf8" stroke="#d7ded4"/>
    <rect x="390" y="365" width="210" height="68" rx="18" fill="#fff5e9" stroke="#e5c7a4"/>
    <rect x="790" y="365" width="310" height="68" rx="18" fill="#fffdf8" stroke="#d7ded4"/>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="82" y="184" fill="#173b33" font-size="21" font-weight="700">React client</text>
    <text x="82" y="215" fill="#52665d" font-size="15">Vite · React Router</text>
    <text x="82" y="244" fill="#52665d" font-size="14">Onboarding · dashboard</text>
    <text x="82" y="268" fill="#52665d" font-size="14">Progress · AI coach</text>
    <text x="420" y="178" fill="#fffdf8" font-size="21" font-weight="700">Node.js + Express API</text>
    <text x="420" y="209" fill="#d9eee5" font-size="15">JWT auth · goals · learning paths</text>
    <text x="420" y="235" fill="#d9eee5" font-size="15">Progress tracking · insights</text>
    <text x="420" y="277" fill="#f9c18f" font-size="13" font-weight="700">AI SERVICE + TEMPLATE FALLBACK</text>
    <text x="820" y="184" fill="#173b33" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="820" y="215" fill="#52665d" font-size="15">Profiles · goals · topics</text>
    <text x="820" y="241" fill="#52665d" font-size="15">Progress · recommendations</text>
    <text x="420" y="407" fill="#8d4c1d" font-size="15" font-weight="700">Curated fallback paths</text>
    <text x="820" y="407" fill="#173b33" font-size="15" font-weight="700">OpenAI API (optional)</text>
    <text x="312" y="200" fill="#63766d" font-size="12">HTTPS / JSON</text>
    <text x="708" y="200" fill="#63766d" font-size="12">SQL</text>
  </g>
</svg>
